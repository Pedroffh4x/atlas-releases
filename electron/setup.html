<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Atlas — conectar este PC</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #000; color: #e8f1ff;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        display: grid; place-items: center; padding: 32px;
      }
      .card {
        width: 100%; max-width: 560px; padding: 36px;
        border: 1px solid rgba(80,150,255,.28); border-radius: 28px;
        background: linear-gradient(160deg, rgba(10,22,48,.9), rgba(0,0,0,.9));
        box-shadow: 0 0 80px rgba(20,90,255,.18);
      }
      h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
      p { margin: 0 0 22px; color: #8fa6c6; font-size: 14px; line-height: 1.5; }
      label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #7f9ec8; margin: 16px 0 6px; }
      input {
        width: 100%; padding: 13px 16px; border-radius: 14px; font-size: 15px;
        background: rgba(255,255,255,.05); border: 1px solid rgba(120,170,255,.22); color: #fff; outline: none;
      }
      input:focus { border-color: #2a8bff; }
      #code { text-transform: uppercase; letter-spacing: .3em; font-family: ui-monospace, Consolas, monospace; }
      button {
        margin-top: 24px; width: 100%; padding: 14px; border: 0; border-radius: 999px; cursor: pointer;
        background: #1263ff; color: #fff; font-size: 15px; font-weight: 600;
      }
      button:hover { opacity: .9; }
      .ghost { margin-top: 10px; background: transparent; color: #8fa6c6; border: 1px solid rgba(120,170,255,.22); }
      .msg { margin-top: 16px; font-size: 13px; min-height: 18px; color: #ff8585; }
      .ok { color: #6fe3a8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Conectar este computador</h1>
      <p>Abra a página <strong>Meu PC</strong> no Atlas, gere um código de pareamento e cole aqui. Depois disso o Atlas abre normalmente e pode analisar sites usando este PC.</p>

      <label for="url">Endereço do Atlas</label>
      <input id="url" type="text" spellcheck="false" />

      <label for="code">Código de pareamento</label>
      <input id="code" type="text" maxlength="12" placeholder="XXXXXXXX" />

      <button id="connect">Conectar</button>
      <button id="skip" class="ghost">Abrir o Atlas sem conectar</button>
      <div class="msg" id="msg"></div>
    </div>

    <script>
      const urlEl = document.getElementById("url");
      const codeEl = document.getElementById("code");
      const msg = document.getElementById("msg");

      window.atlas.getState().then(({ baseUrl }) => { urlEl.value = baseUrl; });
      window.atlas.onStatus((s) => { msg.className = "msg ok"; msg.textContent = s.message; });

      document.getElementById("connect").onclick = async () => {
        msg.className = "msg"; msg.textContent = "Conectando...";
        const res = await window.atlas.connect({ baseUrl: urlEl.value, code: codeEl.value });
        if (res.ok) { msg.className = "msg ok"; msg.textContent = "PC conectado. Abrindo o Atlas..."; }
        else { msg.className = "msg"; msg.textContent = res.error; }
      };

      document.getElementById("skip").onclick = () => window.atlas.skip({ baseUrl: urlEl.value });
    </script>
  </body>
</html>
